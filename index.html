<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mysthigram">
<meta name="description" content="Un feed infinito de artículos de Wikipedia.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&display=swap" rel="stylesheet">
<title>Mysthigram</title>
<style>
:root{
  --paper:#F3F5F2; --ink:#1D2422; --muted:#5E6A66; --line:#DCE2DE; --soft:#E6EBE7;
  --accent:#2F5D8A; --heart:#FF3B5C; --gold:#F2B233;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow-text:0 1px 2px rgba(0,0,0,.45),0 2px 14px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121716;--ink:#E8ECE9;--muted:#93A09B;--line:#26302D;--soft:#1B2220;--accent:#8DB4DD}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:1fr auto;background:var(--paper)}
main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.view[hidden]{display:none}
#home{overflow:hidden;padding:0;background:#000}
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overflow-anchor:none}
#feed::-webkit-scrollbar{display:none}

/* ---------- HUD superior (sobre el feed) ---------- */
.hud{position:absolute;left:0;right:0;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);color:#fff;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.25) 60%,transparent)}
.hud > *{pointer-events:auto}
.hud-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px 18px}
.brand{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.5rem;letter-spacing:-.01em;text-shadow:var(--shadow-text)}
.hud-r{display:flex;align-items:center;gap:10px}
.streak{font-weight:700;font-size:.95rem;text-shadow:var(--shadow-text)}
.ring{position:relative;width:38px;height:38px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .trk{stroke:rgba(255,255,255,.25)}
.ring .val{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring span{font-size:.78rem;font-weight:700}
.ring.done .val{stroke:#5BD68A}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none;transition:opacity .25s,transform .25s}
.stories::-webkit-scrollbar{display:none}
.hud.scrolled .stories{opacity:0;transform:translateY(-12px);pointer-events:none}
.hud.scrolled{background:linear-gradient(rgba(0,0,0,.45),transparent)}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:64px;font-size:.72rem;font-weight:500;text-shadow:var(--shadow-text)}
.st .o{width:60px;height:60px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,#F2B233,#FF3B5C,#B84BFF,#F2B233)}
.st.seen .o{background:rgba(255,255,255,.35)}
.st .i{width:100%;height:100%;border-radius:50%;border:2.5px solid #000;display:grid;place-items:center;font-size:1.5rem;background:var(--c)}
.st span:last-child{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Tarjetas base ---------- */
.card{position:relative;height:100%;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;color:#fff;background:var(--c,#1A201F);transition:background-color .6s}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3) brightness(.7);transform:scale(1.1)}
.main{position:absolute;display:block;opacity:0;transition:opacity .45s}
.main.ready{opacity:1}
.main.cover{inset:0;width:100%;height:100%;object-fit:cover}
.main.land{left:0;right:0;top:16%;width:100%;max-height:48%;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.82) 100%);pointer-events:none}
.noimg{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,color-mix(in srgb,var(--c) 60%,#fff 18%),var(--c) 60%)}
.noimg b{position:absolute;right:-4%;top:6%;font-family:var(--serif);font-size:22rem;line-height:.8;color:rgba(255,255,255,.14);font-weight:500}

.overlay{position:absolute;left:0;right:0;bottom:0;padding:0 84px 20px 18px;z-index:2;text-shadow:var(--shadow-text)}
.acct{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.88rem}
.acct .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;background:var(--tc);box-shadow:0 0 0 2px rgba(255,255,255,.85);text-shadow:none;flex:none}
.acct b{font-weight:700}
.acct small{opacity:.8;font-size:.8rem}
.acct button{display:flex;align-items:center;gap:8px;text-align:left}
.title{font-family:var(--serif);font-weight:500;font-size:clamp(1.75rem,7vw,2.3rem);line-height:1.04;letter-spacing:-.02em;margin-bottom:8px;overflow-wrap:anywhere}
.desc{font-size:.9rem;opacity:.85;margin-bottom:6px}
.text{font-family:var(--serif);font-size:1.04rem;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;opacity:.95}
.meta{display:flex;gap:12px;font-size:.8rem;opacity:.8;margin-top:8px}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;border:1px solid var(--line);padding:9px 15px;border-radius:999px;text-decoration:none;color:var(--ink);text-shadow:none}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:#D6364E;border-color:currentColor}
.card .btn,.story .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card .btn.primary,.story .btn.primary{background:#fff;color:#111;border-color:#fff}

/* Barra de acciones lateral */
.rail{position:absolute;right:8px;bottom:22px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76rem;font-weight:600;min-width:56px;padding:2px;color:#fff;text-shadow:var(--shadow-text)}
.act svg{width:32px;height:32px;fill:rgba(255,255,255,.08);stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.act.like.on svg{fill:var(--heart);stroke:var(--heart)}
.act.save.on svg{fill:var(--gold);stroke:var(--gold)}
.act.pop svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.35)}}
.act span.tick{animation:tick .3s ease-out}
@keyframes tick{from{transform:translateY(6px);opacity:0}}
.follow{position:relative;margin-bottom:6px}
.follow .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--tc);box-shadow:0 0 0 2px #fff}
.follow .plus{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--heart);color:#fff;font-size:.9rem;font-weight:700;display:grid;place-items:center;line-height:1;transition:transform .25s,background .25s}
.follow.on .plus{background:#fff;color:#111}

.burst{position:absolute;left:50%;top:45%;width:110px;height:110px;margin:-55px 0 0 -55px;color:var(--heart);opacity:0;pointer-events:none;z-index:4;filter:drop-shadow(0 6px 20px rgba(0,0,0,.35))}
.burst svg{width:100%;height:100%;fill:currentColor}
.burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.3) rotate(-12deg)}25%{opacity:1;transform:scale(1.15) rotate(6deg)}55%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.2) translateY(-30px)}}
.tap{position:absolute;inset:0;z-index:1;touch-action:manipulation}

/* Tarjeta "¿Sabías que?" */
.t-fact{background:radial-gradient(130% 90% at 0% 0%,color-mix(in srgb,var(--tc) 70%,#fff 12%),var(--tc) 55%,color-mix(in srgb,var(--tc) 60%,#000) 100%)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:150px 84px 40px 22px;z-index:2}
.t-fact .center{pointer-events:none}
.t-fact .center button{pointer-events:auto}
.kicker{font-size:.9rem;font-weight:700;opacity:.85;margin-bottom:14px}
.fact{font-family:var(--serif);font-weight:500;line-height:1.14;letter-spacing:-.015em;margin-bottom:16px}
.src{font-size:.85rem;opacity:.8}

/* Tarjeta de quiz */
.t-quiz{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 55%,#000),#0B0D0D)}
.qimg{width:92px;height:92px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.9);margin-bottom:16px}
.qclaim{font-family:var(--serif);font-size:1.45rem;line-height:1.3;margin:6px 0 22px;padding-left:14px;border-left:3px solid var(--gold)}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{padding:15px 10px;border-radius:16px;font-weight:700;font-size:1.02rem;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#fff;transition:transform .15s,background .25s}
.qbtn:active{transform:scale(.96)}
.qbtn.right{background:#2FA86A;border-color:#2FA86A}
.qbtn.wrong{background:#D6364E;border-color:#D6364E;animation:shake .4s}
.qbtn.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qres{margin-top:18px;line-height:1.5;font-size:.98rem}
.qres b{display:block;font-size:1.2rem;margin-bottom:4px}

/* Carrusel */
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;overflow:hidden}
.slide.txt{display:flex;flex-direction:column;justify-content:center;padding:110px 84px 60px 24px;background:linear-gradient(170deg,color-mix(in srgb,var(--c,#1A201F) 80%,#fff 6%),var(--c,#1A201F))}
.slide.txt p{font-family:var(--serif);font-size:1.28rem;line-height:1.5}
.slide.txt .n{font-size:.85rem;font-weight:700;opacity:.7;margin-bottom:14px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;z-index:3;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:width .25s,background .25s}
.dots i.on{width:18px;background:#fff}
.swipe-hint{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;opacity:.85;margin-top:10px}

/* Pausa y carga */
.t-pause{background:linear-gradient(170deg,#1E2B3A,#0B0D0D)}
.t-pause .big{font-family:var(--serif);font-size:6rem;line-height:.9;font-weight:500;letter-spacing:-.03em}
.t-pause h2{font-family:var(--serif);font-weight:500;font-size:1.7rem;line-height:1.15;margin:10px 0 12px}
.t-pause p{opacity:.8;line-height:1.5;max-width:34ch;margin-bottom:8px}
.skel{background:#141918}
.skel .sh{position:absolute;border-radius:12px;background:linear-gradient(100deg,rgba(255,255,255,.06) 30%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.06) 70%);background-size:300% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.skel .err{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:16px;line-height:1.5}

/* ---------- Páginas ---------- */
.page{padding:18px 20px 40px}
.page h1{font-family:var(--serif);font-weight:500;font-size:2rem;letter-spacing:-.015em;margin-bottom:4px}
.page .sub{color:var(--muted);font-size:.92rem;margin-bottom:18px}
.page h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:30px 0 10px}
.empty{color:var(--muted);padding:24px 0;line-height:1.5;max-width:36ch}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:1.6rem}
.row b{display:block;font-family:var(--serif);font-weight:500;font-size:1.12rem;line-height:1.2}
.row small{color:var(--muted);font-size:.84rem}
.x{color:var(--muted);padding:8px;font-size:1.1rem}

/* Explorar */
.ex-head{position:sticky;top:0;z-index:2;background:var(--paper);padding:14px 0 10px}
.ex-head h1{padding:0 16px;font-family:var(--serif);font-weight:500;font-size:2rem;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:.9rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc((min(100vw,520px) - 4px)/3);gap:2px;grid-auto-flow:dense}
.tile{position:relative;background:var(--soft) center/cover no-repeat;overflow:hidden}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile span{position:absolute;left:6px;bottom:6px;right:6px;color:#fff;font-size:.74rem;font-weight:600;text-shadow:var(--shadow-text);text-align:left;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tile.big span{font-family:var(--serif);font-size:1.15rem;font-weight:500}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.6))}
.tile span{z-index:1}
.tile.sk{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}

/* Perfil */
.prof{display:flex;align-items:center;gap:16px;margin:8px 0 20px}
.prof .pav{width:78px;height:78px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#F2B233,#FF3B5C,#B84BFF,#F2B233)}
.prof .pav div{width:100%;height:100%;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:2rem;border:3px solid var(--paper)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);flex:1;text-align:center}
.counts b{display:block;font-size:1.2rem;font-weight:700}
.counts span{font-size:.76rem;color:var(--muted)}
.goalbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:18px}
.bigring{position:relative;width:96px;height:96px;display:grid;place-items:center}
.bigring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bigring circle{fill:none;stroke-width:9}
.bigring .trk{stroke:var(--soft)}
.bigring .val{stroke:var(--gold);stroke-linecap:round}
.bigring.done .val{stroke:#2FA86A}
.bigring b{font-size:1.5rem}
.bigring small{display:block;font-size:.72rem;color:var(--muted);text-align:center;margin-top:-2px}
.goalbox p{font-size:.92rem;color:var(--muted);margin-bottom:8px;line-height:1.4}
.goals{display:flex;gap:6px;flex-wrap:wrap}
.goals .chip{padding:6px 12px;font-size:.84rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;text-align:center;font-size:.72rem;color:var(--muted)}
.week i{display:block;height:30px;border-radius:9px;background:var(--soft);margin-bottom:4px;display:grid;place-items:center;font-style:normal;font-size:.9rem}
.week i.r{background:color-mix(in srgb,var(--gold) 45%,var(--soft))}
.week i.g{background:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:.78rem;line-height:1.3}
.badge i{display:block;font-style:normal;font-size:1.8rem;margin-bottom:4px}
.badge.lock{opacity:.35;filter:grayscale(1)}
.topicrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.topicrow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tc);font-size:1.1rem}
.topicrow b{font-weight:600;font-size:.95rem}
.topicrow small{color:var(--muted);font-size:.8rem}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.fbtn{font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.fbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note-row{padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;display:block}
.note-row q{display:block;font-family:var(--serif);font-size:1.05rem;line-height:1.45;quotes:none;margin-bottom:4px}
.note-row small{color:var(--muted);font-size:.82rem}

/* ---------- Navegación ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);transition:background .3s,color .3s}
.app.immersive .tabs{background:#000;border-color:rgba(255,255,255,.1);color:#fff}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:.7rem;font-weight:500;opacity:.6}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{opacity:1}
.tab[aria-current="page"] svg{stroke-width:2.3}
.dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--heart);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center}
.dot:empty{display:none}

/* ---------- Hoja inferior ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:90dvh;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 10px 20px;border-bottom:1px solid var(--line);font-weight:700}
.sheet-body{overflow-y:auto;padding:18px 20px 24px;flex:1;min-height:0}
.sheet-foot:empty{display:none}
.sheet-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-end}
.read-img{width:100%;max-height:280px;object-fit:cover;border-radius:16px;margin-bottom:16px;display:block;background:var(--soft)}
.sheet .title{font-size:1.9rem;color:var(--ink)}
.sheet .desc{color:var(--muted);opacity:1}
.sheet .acct{text-shadow:none}
.sheet .acct small{color:var(--muted);opacity:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.acts .btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts .on svg{fill:currentColor}

/* ---------- Coreano ---------- */
:root{--kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.kr{font-family:var(--kr)}
#kofeed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overflow-anchor:none}
#kofeed::-webkit-scrollbar{display:none}
#kofeed[hidden]{display:none}
.gtabs{display:flex;justify-content:center;gap:26px;padding:0 0 8px}

.gdot{position:absolute;top:-6px;right:-16px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--heart);color:#fff;font-size:.64rem;display:grid;place-items:center;text-shadow:none}

.hud.ko .stories{display:none}
.t-ko{background:radial-gradient(120% 90% at 10% 0%,color-mix(in srgb,var(--kc) 75%,#fff 12%),var(--kc) 55%,color-mix(in srgb,var(--kc) 55%,#000))}
.kshade{position:absolute;inset:0;background:rgba(0,0,0,.58)}
.kc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:150px 24px 36px;z-index:2;text-shadow:var(--shadow-text);overflow-y:auto}
.kbig{font-family:var(--kr);font-weight:700;font-size:clamp(3rem,15vw,4.6rem);line-height:1.08;margin:4px 0 6px;overflow-wrap:anywhere}
.kjamo{font-family:var(--kr);font-weight:700;font-size:8.5rem;line-height:1}
.kphrase{font-family:var(--kr);font-weight:700;font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.25;margin:6px 0}
.krom{font-size:1.15rem;opacity:.85;letter-spacing:.02em;margin-bottom:12px}
.ksay{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:1.35rem;display:grid;place-items:center;margin-bottom:16px;text-shadow:none;color:#fff}
.ksay.sm{width:34px;height:34px;font-size:.9rem;margin:0 0 0 6px;display:inline-grid;vertical-align:middle}
.ksay.lite{background:var(--fb-hover);border-color:var(--fb-line);color:var(--fb-ink)}
.kmean{font-family:var(--serif);font-size:1.9rem;font-weight:500;line-height:1.2}
.kdesc{opacity:.8;margin-top:4px}
.kq{font-size:1.1rem;margin:4px 0 14px}
.kans,.kafter{display:none}
.shown .kans{display:block}
.shown .kafter{display:flex}
.shown .kreveal{display:none}
.kbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn.on{opacity:.75}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px}
.kopts .qbtn{font-size:.95rem;line-height:1.3}
.kres{margin-top:16px;line-height:1.5}
.kread{font-family:var(--kr);font-size:1.4rem;line-height:1.6;margin:6px 0 10px}
.kromline,.ktrans{display:none;line-height:1.5;opacity:.92;margin-bottom:10px}
.romon .kromline,.transon .ktrans{display:block}
.kgrade{display:none;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:16px}
.shown .kgrade{display:grid}
.kgrade button{padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;font-size:.86rem;line-height:1.3}
.kgrade small{display:block;font-weight:500;opacity:.85;font-size:.72rem}
.kgrade .g0{background:rgba(214,54,78,.55)}
.kgrade .g3{background:rgba(47,168,106,.55)}
.kdone{grid-column:1/-1;font-weight:700}
.kname{font-size:1.2rem;margin:10px 0 4px}
.ksound{opacity:.92}
.kex{margin-top:10px;font-size:1.05rem}
.klevels{display:grid;gap:10px;width:100%}
.klv{text-align:left;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff}
.klv b{display:block;font-size:1.05rem}
.klv span{font-size:.86rem;opacity:.85}
.kpw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:220px;padding:24px;color:#fff;text-align:center;background:linear-gradient(135deg,#C8385A,#5A2C70)}
.kpw.img{background:linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.52)),var(--kimg) center/cover}

.kpw > span{opacity:.92}
.kpw .ksay{margin:8px 0 0}
.kpb{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.kread-b{font-size:1.2rem;line-height:1.6}
.kvrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.kvrow b{font-size:1.2rem}
.kvrow small{color:var(--muted)}
.kvrow span{display:block;color:var(--muted);font-size:.88rem}
.kvdue{font-size:.76rem}
.kvrow .ksay.sm{background:var(--soft);border-color:var(--line);color:var(--ink);margin:0}
.kobox .stats{margin-bottom:12px}

/* ---------- Citas, viajes y rutas ---------- */
.t-quote{background:radial-gradient(130% 90% at 0% 0%,color-mix(in srgb,var(--tc) 70%,#fff 10%),var(--tc) 55%,color-mix(in srgb,var(--tc) 55%,#000) 100%)}
.qshade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.72))}
.t-quote .center{pointer-events:none}
.t-quote .center button{pointer-events:auto}
.qmark{font-family:var(--serif);font-size:5rem;line-height:.6;height:2.2rem;opacity:.7}
.qtext{font-family:var(--serif);font-style:italic;font-weight:500;line-height:1.28;margin-bottom:14px}
.qauthor{font-weight:700;font-size:1rem}

.qsrc{font-size:.85rem;opacity:.8;margin-top:2px}
.pquote{margin:0 14px 12px;padding:26px 22px;border-radius:12px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 80%,#fff 10%),color-mix(in srgb,var(--tc) 70%,#000))}

.fb-tabs{grid-template-columns:repeat(5,1fr)}

.wbp{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 14px}
.wbp-c{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;background:var(--tc)}
.wbp-b b{display:block;font-size:.95rem}
.wbp-b small{display:block;color:var(--fb-muted);font-size:.8rem;line-height:1.35}
.wbp .bar{display:block;margin:6px 0 3px}
.wbh{margin-top:0}
.wbh-cover{height:130px;display:grid;place-items:center;font-size:4rem;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 75%,#fff 15%),color-mix(in srgb,var(--tc) 70%,#000))}
.wbh-b{padding:14px}
.wbh-b h1{font-size:1.4rem;line-height:1.2}
.wbh-b > p{color:var(--fb-muted);font-size:.9rem;margin-top:4px}
.wbh-b .bar{display:block;margin-top:10px}
.wb-fin{margin-top:10px;font-weight:700;color:var(--fb-ink)!important}
.wbls{padding:4px 0}
.wbl{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px;font-size:.93rem}
.wbl[hidden]{display:none}
.wbl-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--fb-hover);color:var(--fb-muted)}
.wbl.done .wbl-n{background:#2FA86A;color:#fff}
.wbl.next{background:color-mix(in srgb,var(--fb-blue) 8%,transparent)}
.wbl.next .wbl-n{background:var(--fb-blue);color:#fff}
.wbl small{color:var(--fb-blue);font-weight:700;font-size:.75rem}
.wb-filter{width:100%;font:inherit;font-size:1rem;padding:10px 14px;border-radius:999px;border:1px solid var(--fb-line);background:var(--fb-hover);color:var(--fb-ink)}
.wb-crumb{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.wb-body{font-size:1.02rem;line-height:1.6;margin-top:10px}
.wb-body p,.wb-body ul,.wb-body ol,.wb-body dl,.wb-body blockquote{margin-bottom:.8em}
.wb-body ul,.wb-body ol{padding-left:1.3em}
.wb-body h2,.wb-body h3,.wb-body h4{font-family:var(--serif);font-weight:500;margin:1.1em 0 .4em;line-height:1.25}
.wb-body h2{font-size:1.35rem}
.wb-body h3{font-size:1.15rem}
.wb-body img{max-width:100%;height:auto;border-radius:10px}
.wb-body .wb-tw{overflow-x:auto;margin-bottom:1em}
.wb-body table{border-collapse:collapse;font-size:.92rem}
.wb-body th,.wb-body td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.wb-body th{background:var(--soft)}
.wb-body a{color:var(--accent)}
.wbq{margin:18px 0 6px;padding:16px;border-radius:16px;background:var(--soft)}

.wbq-o .chip.bad{background:#D6364E;border-color:#D6364E;color:#fff}
.wbq-r{margin-top:10px;font-size:.95rem}
.wb-res{text-align:center;padding:20px 0}
.wb-res .big{font-family:var(--serif);font-size:3.5rem;font-weight:500;line-height:1.1}

.card.golden::after{content:"✨ Publicación dorada";position:absolute;left:18px;top:calc(env(safe-area-inset-top,0px) + 108px);z-index:4;padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;color:#3A2A00;background:linear-gradient(135deg,#FFE08A,#E8A317);box-shadow:0 4px 18px rgba(232,163,23,.5)}

.lbs{font-weight:700}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = (s) => { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const rnd = (n) => Math.floor(Math.random() * n);
const pickOne = (arr) => arr[rnd(arr.length)];

const fmt = (n) => n >= 1000 ? `${(n / 1000).toFixed(1).replace('.0', '')} mil` : String(n);
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  return new Date(ts).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;

  const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

    const d = x.getImageData(0, 0, 14, 14).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      const w = 1 + (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2])) / 30;
      r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; n += w;
    }
    const [h, s] = rgbToHsl(r / n, g / n, b / n);
    el.style.setProperty('--c', `hsl(${h.toFixed(0)} ${(Math.min(s, 0.6) * 100).toFixed(0)}% 17%)`);

function compose(list, first = false) {

function interleave(main, extra) {
  const out = [...main], ids = new Set(main.map((a) => a.id));
  extra.filter((a) => !ids.has(a.id) && ids.add(a.id)).forEach((a, i) => out.splice(Math.min(1 + i * 2, out.length), 0, a));

}
let loading = false, retries = 0, firstBatch = true;
async function fetchBatch() {
  const exq = Math.random() < (S.follows.citas ? 0.6 : 0.35) ? fetchQuotes(2).catch(() => []) : Promise.resolve([]);
  const exv = Math.random() < (S.follows.viajes ? 0.6 : 0.3) ? fetchVoyages(2).catch(() => []) : Promise.resolve([]);
  const wk = weightedTopic(), lt = S.liked.length && Math.random() < 0.6 ? pickOne(S.liked.slice(0, 10)) : null;
  const jobs = [fetchRandom(10), fetchTopic(wk, 5).catch(() => [])];
  if (lt) jobs.push(fetchSimilar(lt, 4).catch(() => []));
  const [rand, topic, sim = []] = await Promise.all(jobs);
  if (S.follows[wk] || S.groups?.[wk]) topic.forEach((a) => { a.why = 'sigues:' + wk; });
  sim.forEach((a) => { a.why = 'like:' + lt; });
  const [xq, xv] = await Promise.all([exq, exv]);

}
async function loadMore() {
  if (loading) return;

  try {
    const list = await fetchBatch();
    const atSentinel = feed.scrollTop >= sentinel.offsetTop - 10;
    let firstNew = null;
    compose(list, firstBatch).forEach((item) => { const el = makeCard(item); feed.insertBefore(el, sentinel); firstNew = firstNew || el; added++; });
    if (firstNew && atSentinel) feed.scrollTo({ top: firstNew.offsetTop, behavior: 'instant' });
    if (added) firstBatch = false;
  } catch {
    loading = false; showError(); return;
  }

}
new IntersectionObserver((es) => { if (es[0].isIntersecting) loadMore(); }, { root: feed, rootMargin: '0px 0px 150% 0px' }).observe(sentinel);

function countRead(el) {

}

function particles(x, y, color, count = 8) {

    const p = document.createElement('div');

    document.body.append(p);

    p.animate([
      { transform: 'translate(-50%,-50%) scale(.5)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(ang) * d}px), calc(-50% + ${Math.sin(ang) * d - 40}px)) scale(${0.5 + Math.random() * 0.7}) rotate(${rnd(60) - 30}deg)`, opacity: 0 }
    ], { duration: 700 + rnd(400), easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
  }
}

    p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${vx * 0.6}px, ${vy * 0.6}px) rotate(${rnd(360)}deg)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${vx}px, ${vy + 420}px) rotate(${rnd(720)}deg)`, opacity: 0 }
    ], { duration: 1300 + rnd(500), easing: 'cubic-bezier(.25,.6,.4,1)' }).onfinish = () => p.remove();
  }
}
function flyToSaved(from) {
  const tab = $('.tab[data-view="saved"]');
  if (reduced || !from) { updateSavedDot(); return; }
  const a = from.getBoundingClientRect(), b = tab.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly'; f.innerHTML = ICON.save;
  f.style.left = `${a.left + a.width / 2 - 15}px`; f.style.top = `${a.top + a.height / 2 - 15}px`;

  ], { duration: 700, easing: 'ease-in-out' }).onfinish = () => {

}

function toggleLike(id, force) {
  const a = getA(id); if (!a) return false;
  const on = force ?? !S.likes[id];
  if (on === !!S.likes[id]) return on;
  if (on) {
    S.likes[id] = { ...pick(a), at: Date.now() };
    S.liked = [a.title, ...S.liked.filter((t) => t !== a.title)].slice(0, 40);
    S.likedTopics[a.topic] = (S.likedTopics[a.topic] || 0) + 1;
    buzz(10);
  } else {
    delete S.likes[id]; delete S.reacts[id]; S.liked = S.liked.filter((t) => t !== a.title);
    S.likedTopics[a.topic] = Math.max(0, (S.likedTopics[a.topic] || 1) - 1);
  }
  persist(); repaint(id); repaintSheet(id);
  return on;
}
function toggleSave(id, fromEl) {
  const a = getA(id); if (!a) return;
  if (S.saved[id]) { delete S.saved[id]; S.newSaves = Math.max(0, S.newSaves - 1); updateSavedDot(); toast('Quitado de guardados'); }
  else { S.saved[id] = { ...pick(a), at: Date.now() }; S.newSaves++; buzz(10); flyToSaved(fromEl); }
  persist(); repaint(id); repaintSheet(id); checkBadges();
}

async function wdLite(qid) {

    const p = r.prop.value.split('/').pop(), rank = /Preferred/.test(r.rank.value) ? 'preferred' : 'normal';

}

    return monthHit;
  },
  'detras.del.articulo': (D) => {
    if (!D.created) return null;
    const c = new Date(D.created);
    const date = c.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    return D.edits ? `Curiosidad de Wikipedia: este artículo se creó el ${date} y desde entonces lo han editado ${nf(D.edits)} veces ✏️`
      : `Curiosidad de Wikipedia: este artículo se creó el ${date}, hace ${new Date().getFullYear() - c.getFullYear()} años ✏️`;
  },
  'termometro': (D) => {
    const vals = Object.keys(D.views).sort().map((k) => D.views[k] || 0);
    if (vals.length < 7) return null;
    const total = vals.reduce((s, x) => s + x, 0);
    if (!total) return 'Casi nadie lo lee estos días… somos de los pocos 😎';
    const last = vals.slice(-3), prev = vals.slice(0, -3);
    const avg = (x) => x.reduce((s, v) => s + v, 0) / x.length;
    const ratio = avg(last) / Math.max(1, avg(prev));
    if (ratio > 1.4 && avg(last) > 20) return `Está subiendo: estos días tiene ${nf((ratio - 1) * 100)}% más visitas que antes 📈`;
    if (ratio < 0.7) return `Anda tranquilo: bajaron sus visitas, ahora unas ${nf(avg(last))} al día 📉`;
    return `Recibe unas ${nf(avg(vals))} visitas al día, muy estable 🌡️`;
  },
  'fuentes': (D, r) => {
    const ext = D.ext.filter((u) => /^https?:/.test(u) && !/wikipedia|wikimedia|wikidata|wiktionary/.test(u));
    if (!ext.length) return null;
    const nice = ext.filter((u) => !/archive\.org|doi\.org|worldcat|books\.google/.test(u));
    const u = pickR(nice.length ? nice : ext, r);
    let host = ''; try { host = new URL(u).hostname.replace(/^www\./, ''); } catch { return null; }
    return `Revisé las fuentes: el artículo cita ${ext.length >= 30 ? 'más de 30' : ext.length} ${ext.length === 1 ? 'enlace externo' : 'enlaces externos'}. Por ejemplo: <a href="${esc(u)}" target="_blank" rel="noopener">${esc(host)}</a> 📚`;
  },
  'madriguera.profunda': (D, r) => {
    const sim = new Set(D.similar.map((x) => x.title));
    const ls = D.links.filter((t) => t !== D.a.title && !sim.has(t) && !/^\d{1,4}( a\. C\.)?$/.test(t) && !/^(Anexo|Wikipedia|Categoría|Siglo)/i.test(t));
    if (!ls.length) return null;
    return `Si te gustó esto, sigue con ${alink(pickR(ls, r))}. Es de esos artículos donde se te van dos horas 🕳️`;
  },
  'mismo.tema': (D, r) => {
    if (D.catMembers.length < 2) return null;
    return `Otros de la categoría «${esc(D.catName)}»: ${list3(shuffleR(D.catMembers, r).slice(0, 3).map(alink))} 🗃️`;
  },
  'contraste': (D, r) => {
    const opts = D.similar.slice(3).filter((x) => x.desc);
    if (!opts.length) return null;
    const x = pickR(opts, r);
    return `Para comparar: ${alink(x.title)} (${esc(x.desc)}). Tienen más en común de lo que parece ⚖️`;
  },
  'nostalgia': (D, r) => esc(pickR(NOST[D.a.topic] || NOST.curiosidades, r)),
  'quiz.rapido': (D, r) => {
    const s = sentencesOf(plain(D.full)).slice(1).filter((x) => x.length > 60 && x.length < 220 && /\b(1[0-9]{3}|20[0-2][0-9])\b/.test(x));
    if (!s.length) return null;
    const x = pickR(s, r), year = /\b(1[0-9]{3}|20[0-2][0-9])\b/.exec(x)[1];
    return `Mini quiz, completen la frase 👇<br>«${esc(x.replace(year, '____'))}»<br><button class="reveal" data-reveal="${year}">Ver respuesta</button>`;
  }
};

function pickClaim(text, r) {
  const s = sentencesOf(text.replace(/\s*\([^()]*\)/g, '')).filter((x) => x.length > 40 && x.length < 180);
  if (!s.length) return null;
  const withNum = s.filter((x) => /\d/.test(x));
  return short(pickR(withNum.length ? withNum : s.slice(1).length ? s.slice(1) : s, r), 140).replace(/\.$/, '');
}

async function buildThread(a) {
  if (String(a.id).startsWith('ko:')) return koThread(a);
  const D = await gatherData(a);
  const r = mulberry(hash(a.id + 'thread'));
  const made = {};
  for (const k of Object.keys(B)) { try { const h = B[k](D, r); if (h) made[k] = h; } catch {} }
  const mk = (k, html, depth = 0) => ({ k, html, depth, replies: [] });
  const top = [];

  const QS = [['etimologia', '¿Alguien sabe de dónde viene el nombre? 🤔'], ['la.del.mapa', '¿Y esto dónde queda exactamente?'],
    ['la.calculadora', '¿Hace cuánto fue esto? No me ubico con las fechas 😅'], ['fichas', '¿Alguien tiene datos concretos? Fechas, números, lo que sea'],
    ['galeria', '¿Hay más fotos? 👀'], ['otros.nombres', '¿Se le conoce con otro nombre?']];
  const avail = QS.filter(([k]) => made[k]);

    c.replies.push(mk(k, `${mention('la.preguntona')} ${made[k]}`, 1));
    delete made[k]; top.push(c);
  }
  if (made.fuentes) {
    const claim = pickClaim(a.text, r);
    if (claim) {
      const c = mk('el.esceptico', `«${esc(claim)}»… ¿en serio? Suena exagerado 🤨`);
      c.replies.push(mk('fuentes', `${mention('el.esceptico')} Es real. ${made.fuentes}`, 1));
      delete made.fuentes; top.push(c);
    }
  }
  Object.entries(made).forEach(([k, h]) => top.push(mk(k, h)));

  const REACT = ['¡No sabía eso! 😮', 'Justo leí sobre esto ayer', 'Esto merece más corazones', 'Me acabo de ir a leerlo completo', 'Guardado 🔖',
    'Qué buen dato', 'Con razón…', 'Wow 🤯', 'Lo voy a contar en la comida 😂', 'Gracias por compartir'];
  const reactors = ['nostalgia', 'el.curioso', 'la.preguntona', 'madriguera.profunda', 'quiz.rapido', 'dato.extra', 'galeria', 'conexiones'];
  top.filter((c) => !c.replies.length).forEach((c) => {
    if (r() < 0.35) c.replies.push(mk(pickR(reactors.filter((x) => x !== c.k), r), `${mention(c.k)} ${esc(pickR(REACT, r))}`, 1));
  });

  const post = likeCount(a.id), postH = 1 + (hash(a.id + 'h') % 22);
  top.forEach((c) => { setMeta(c, a, post, postH, null); c.replies.forEach((x) => setMeta(x, a, post, postH, c)); });
  top.sort((x, y) => y.base - x.base);
  return top;
}

/* Corazones: nunca más que la publicación; las respuestas, nunca más que su comentario */
function setMeta(c, a, post, postH, parent) {
  const u = hash(`${a.id}|${c.k}|${parent ? parent.k : ''}`) / 4294967296;
  c.topBadge = P[c.k].top.includes(a.topic);
  c.key = `${a.id}:${c.k}${parent ? ':r' : ''}`;
  if (!parent) {
    let f = 0.004 + Math.pow(u, 2.3) * 0.22;
    if (c.topBadge) f *= 1.8;
    f *= 1 + Math.min(0.5, (S.likedTopics[a.topic] || 0) * 0.05);
    c.base = Math.max(0, Math.min(post - 1, Math.floor(post * f)));
    c.mins = Math.max(2, Math.floor(postH * 60 * (0.15 + u * 0.8)));
  } else {
    c.base = Math.max(0, Math.min(parent.base, Math.floor(parent.base * (0.03 + Math.pow(u, 1.4) * 0.55))));
    c.mins = Math.max(1, Math.floor(parent.mins * (0.1 + u * 0.85)));
  }
}

function rxBreakdown(id) {
  const total = likeCount(id), mine = S.likes[id] ? (S.reacts[id] || 'like') : null;
  const base = total - (mine ? 1 : 0), h = (s) => hash(id + s);
  const w = { like: 55 + h('a') % 20, love: 10 + h('b') % 15, wow: 2 + h('c') % 10, haha: 1 + h('d') % 7, sad: h('e') % 4, angry: h('f') % 3 };
  const sum = Object.values(w).reduce((x, y) => x + y, 0), c = {};
  let used = 0;
  RX_KEYS.forEach((k) => { c[k] = Math.floor(base * w[k] / sum); used += c[k]; });
  c.like += base - used;
  if (mine) c[mine] = (c[mine] || 0) + 1;
  return c;
}
function setReaction(id, r) {
  if (!S.likes[id]) toggleLike(id, true);

}

function reactorsFor(id, c, k, mine) {
  const r = mulberry(hash(id + 'rx' + k));
  const keys = k === 'all' ? RX_KEYS.filter((x) => c[x] > 0) : [k];
  const count = keys.reduce((s, x) => s + c[x], 0);
  const pickRx = () => { let v = r() * count; for (const x of keys) { if ((v -= c[x]) <= 0) return x; } return keys[0]; };
  const rows = [];
  if (mine && (k === 'all' || k === mine)) rows.push({ n: myName(), you: true, rx: mine });
  const personas = shuffleR(Object.keys(P), r);
  let pi = 0;
  while (rows.length < Math.min(count, 40)) {
    const rx = k === 'all' ? pickRx() : k;
    if (pi < personas.length && r() < 0.45) { const p = P[personas[pi++]]; rows.push({ n: p.n, e: p.e, c: p.c, rx }); }
    else { const n = `${pickR(FIRST, r)} ${pickR(LAST, r)}`; rows.push({ n, e: n.split(' ').map((x) => x[0]).join(''), c: pickR(AVC, r), rx }); }
  }
  return { rows, more: Math.max(0, count - rows.length) };
}

const bookReadObs = new IntersectionObserver((es) => {

}, { root: bookEl, threshold: [0, 0.25, 0.5, 0.75, 1] });

/* Romanización revisada, aproximada, con enlace y nasalización básicos */
const RR_I = ['g', 'kk', 'n', 'd', 'tt', 'r', 'm', 'b', 'pp', 's', 'ss', '', 'j', 'jj', 'ch', 'k', 't', 'p', 'h'];
const RR_V = ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'];
const RR_F = ['', 'k', 'k', 'k', 'n', 'n', 'n', 't', 'l', 'k', 'm', 'l', 'l', 'l', 'p', 'l', 'm', 'p', 'p', 't', 't', 'ng', 't', 't', 'k', 't', 'p', 't'];
const RR_LINK = { 1: 'g', 2: 'kk', 4: 'n', 7: 'd', 8: 'r', 16: 'm', 17: 'b', 19: 's', 20: 'ss', 22: 'j', 23: 'ch', 24: 'k', 25: 't', 26: 'p' };
function romanize(str) {
  const chars = [...String(str)];
  const syl = chars.map((c) => { const x = c.charCodeAt(0) - 0xAC00; return x >= 0 && x <= 11171 ? { i: Math.floor(x / 588), v: Math.floor((x % 588) / 28), f: x % 28 } : null; });
  let out = '';
  chars.forEach((c, k) => {
    const s = syl[k]; if (!s) { out += c; return; }
    const n = syl[k + 1];
    let fin = RR_F[s.f];
    if (n && s.f) {
      if (n.i === 11 && RR_LINK[s.f] != null) { n.ini = RR_LINK[s.f]; fin = ''; }
      else if (n.i === 11 && s.f === 27) fin = '';
      else if ((n.i === 2 || n.i === 6) && ['k', 't', 'p'].includes(fin)) fin = { k: 'ng', t: 'n', p: 'm' }[fin];
      else if (s.f === 8 && n.i === 5) n.ini = 'l';
    }
    out += (s.ini ?? RR_I[s.i]) + RR_V[s.v] + fin;
  });
  return out;
}

/* Contenido desde Wikipedia (títulos y primeras frases en coreano) */
const KPROPS = PROPS.replace('%7Cinfo', '%7Cinfo%7Clanglinks') + '&lllang=ko&lllimit=max';
let koWikiPool = [];
const KO_WSEEN = new Set(), KO_REV = new Set(), KO_H = new Set();
function koFirstSentence(t) {
  let s = t; for (let i = 0; i < 3; i++) s = s.replace(/\([^()]*\)/g, '');
  s = s.replace(/\s+/g, ' ').replace(/\s+([,.])/g, '$1').trim();
  const m = /^.*?[다요]\.(?=\s|$)/.exec(s) || /^[^.]*\./.exec(s);
  const r = m ? m[0].trim() : '';
  return r.length >= 10 && r.length <= 110 && /[가-힣]/.test(r) ? r : '';
}
async function koWikiFetch() {
  const k = pickOne(TOPIC_KEYS);
  const params = Math.random() < 0.35 ? '&generator=random&grnnamespace=0&grnlimit=20'
    : `&generator=search&gsrnamespace=0&gsrlimit=20&gsroffset=${rnd(40)}&gsrsearch=${encodeURIComponent('morelike:' + pickOne(TOPICS[k].seeds))}`;
  const r = await fetch(`${API}?action=query${params}${KPROPS}`);
  if (!r.ok) throw new Error();
  const items = ((await r.json()).query?.pages || []).map((p) => {
    const kt = (p.langlinks || [])[0]?.title; if (!kt) return null;
    const a = { id: String(p.pageid), title: p.title, desc: p.description || '', text: (p.extract || '').trim(), img: p.thumbnail?.source || '',
      w: p.thumbnail?.width || 0, h: p.thumbnail?.height || 0, url: p.fullurl || `https://es.wikipedia.org/wiki/${encodeURIComponent(p.title)}` };
    a.topic = classify(a);
    const ko = kt.replace(/\s*\([^)]*\)\s*$/, '').trim();
    return { a, kt, ko, word: /^[가-힣 ]{1,12}$/.test(ko) && ko.replace(/ /g, '').length <= 8 && a.text.length > 60 };
  }).filter(Boolean);
  if (items.length) {
    try {
      const kr = await fetch(`https://ko.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&prop=extracts&exintro=1&explaintext=1&exlimit=20&redirects=1&titles=${encodeURIComponent(items.slice(0, 20).map((x) => x.kt).join('|'))}`);
      const kj = await kr.json();
      const map = new Map((kj.query?.pages || []).map((p) => [p.title, p.extract || '']));
      [...(kj.query?.redirects || []), ...(kj.query?.normalized || [])].forEach((x) => { if (map.has(x.to)) map.set(x.from, map.get(x.to)); });
      items.forEach((x) => { const s = koFirstSentence(map.get(x.kt) || ''); if (s && x.a.text.length > 60) x.read = s; });
    } catch {}
  }
  return items;
}

/* Generador de tarjetas */
const basicW = ([w, m]) => ({ w, m, src: 'basic' });
const wikiW = (x) => ({ w: x.ko, m: x.a.title, desc: x.a.desc, img: x.a.img, aid: x.a.id, src: 'wiki' });
function quizFor(w) {
  const pool = [...new Set([...BASIC.map((b) => b[1]), ...koWikiPool.map((x) => x.a.title)])].filter((m) => m !== w.m);
  const opts = [w.m, ...pool.sort(() => Math.random() - 0.5).slice(0, 3)].sort(() => Math.random() - 0.5);
  return { type: 'quiz', w, opts, correct: opts.indexOf(w.m) };
}
async function koItems({ book = false } = {}) {
  const lvl = S.ko.level || 'basico', out = [];
  if (!book) dueWords().filter((x) => !KO_REV.has(x.w)).slice(0, 4).forEach((x) => { KO_REV.add(x.w); out.push({ type: 'review', w: x }); });
  if (lvl !== 'hangul' && koWikiPool.length < 8) { try { koWikiPool.push(...(await koWikiFetch()).filter((x) => !KO_WSEEN.has(x.a.id))); } catch {} }
  const take = (n, f) => { const r = []; for (let i = 0; i < koWikiPool.length && r.length < n;) { if (f(koWikiPool[i])) { const x = koWikiPool.splice(i, 1)[0]; KO_WSEEN.add(x.a.id); r.push(x); } else i++; } return r; };
  const basic = (n) => Array.from({ length: n }, () => basicW(BASIC[S.ko.seenB++ % BASIC.length]));
  const phrase = () => { const p = PHRASES[S.ko.seenP++ % PHRASES.length]; return { type: 'phrase', w: { w: p[0], m: p[1], src: 'phrase' } }; };
  const quizTarget = () => {
    const saved = Object.values(S.ko.words).filter((x) => x.src !== 'phrase');
    if (saved.length && Math.random() < 0.6) { const x = pickOne(saved); return { w: x.w, m: x.m, src: x.src }; }
    return basicW(BASIC[rnd(Math.max(1, Math.min(BASIC.length, S.ko.seenB)))]);
  };
  if (lvl === 'hangul') {
    const pending = HANGUL.map((_, i) => i).filter((i) => !S.ko.hangul[i]);
    if (!pending.length) { S.ko.level = 'basico'; toast('¡Completaste el hangul! Ahora estás en nivel básico 🎉'); }
    else {
      let fresh = pending.filter((i) => !KO_H.has(i));
      if (!fresh.length) { KO_H.clear(); fresh = pending; }
      fresh.slice(0, book ? 1 : 4).forEach((i) => { KO_H.add(i); out.push({ type: 'hangul', i }); });
    }
    out.push(phrase()); basic(2).forEach((w) => out.push({ type: 'word', w })); out.push(quizFor(quizTarget()));
  } else {
    const nb = lvl === 'basico' ? 3 : 1, nw = lvl === 'basico' ? 2 : 4, nr = lvl === 'basico' ? 1 : 2;
    basic(nb).forEach((w) => out.push({ type: 'word', w }));
    out.push(phrase());
    take(nw, (x) => x.word).forEach((x) => out.push({ type: 'word', w: wikiW(x), a: x.a }));

  'Gabriela Mistral', 'Sor Juana Inés de la Cruz', 'Miguel de Cervantes', 'Antonio Machado', 'Federico García Lorca', 'Benito Juárez', 'Simón Bolívar',

const QSKIP = /sobre |acerca|atribuid|dudos|erróne|mal atribu|véase|referencias|enlaces|fuentes|notas|bibliograf/i;
async function quotesFromPage(pid) {
  const j = await getJSON(`${WQ}?action=parse&pageid=${pid}&prop=text&format=json&formatversion=2&origin=*&disableeditsection=1`);
  const doc = new DOMParser().parseFromString(j.parse?.text || '', 'text/html');
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  let sec = ''; const out = [];
  for (const el of root.children) {
    if (/^H[2-4]$/.test(el.tagName) || el.classList.contains('mw-heading')) { sec = el.textContent.trim(); continue; }
    if (QSKIP.test(sec) || el.tagName !== 'UL') continue;
    for (const li of el.children) {
      if (li.tagName !== 'LI') continue;
      const c = li.cloneNode(true);
      const sub = c.querySelector('ul,dl');
      const s = sub ? sub.textContent.replace(/\s+/g, ' ').replace(/^Fuente:\s*/i, '').trim() : '';
      c.querySelectorAll('ul,dl,sup').forEach((x) => x.remove());
      const q = c.textContent.replace(/\s+/g, ' ').replace(/\[\d+\]/g, '').trim().replace(/^[«"“]\s*|\s*[»"”]$/g, '');
      if (q.length >= 30 && q.length <= 320) out.push({ q, s: short(s, 120) });
    }
    if (out.length >= 25) break;
  }
  return out;
}
async function fetchQuotes(n = 2, forFeed = true) {
  const names = [...QUOTE_AUTHORS].sort(() => Math.random() - 0.5).slice(0, 2);
  const j = await getJSON(`${WQ}?action=query&format=json&formatversion=2&origin=*&redirects=1&titles=${encodeURIComponent(names.join('|'))}&prop=pageimages%7Cinfo%7Cdescription&piprop=thumbnail&pithumbsize=500&inprop=url`);
  const pages = (j.query?.pages || []).filter((p) => !p.missing && p.pageid);
  const out = [];
  for (const p of pages) {
    if (out.length >= n) break;
    try {
      const qs = await quotesFromPage(p.pageid);
      const fresh = qs.filter((x) => !(forFeed && seen.has(`q:${p.pageid}:${hash(x.q) % 100000}`)));
      if (!fresh.length) continue;
      const x = pickOne(fresh);
      out.push({ id: `q:${p.pageid}:${hash(x.q) % 100000}`, pid: p.pageid, api: WQ, rest: 'https://es.wikiquote.org/w/rest.php', src: 'quote',
        title: p.title, desc: p.description || 'Cita de Wikiquote', q: x.q, qs: x.s,
        text: `«${x.q}»\n\n${p.title}${x.s ? `, ${x.s}` : ''}`, img: p.thumbnail?.source || '', w: p.thumbnail?.width || 0, h: p.thumbnail?.height || 0,
        url: p.fullurl || `https://es.wikiquote.org/wiki/${encodeURIComponent(p.title)}`, topic: 'citas' });
    } catch {}
  }
  return out;
}

function sanitizeWB(raw) {
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  root.querySelectorAll('script,style,link,meta,.navbox,.noprint,.mw-editsection,.reference,.references,.mw-references-wrap,.toc,#toc,.metadata,.ambox,.mbox-small,.printfooter,.catlinks,.navigation-not-searchable,math,svg').forEach((n) => n.remove());
  const ALLOW = new Set(['P', 'H2', 'H3', 'H4', 'H5', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'B', 'STRONG', 'I', 'EM', 'DL', 'DT', 'DD', 'IMG', 'BR', 'SPAN', 'DIV', 'BLOCKQUOTE', 'SUP', 'SUB', 'CODE', 'PRE', 'FIGURE', 'FIGCAPTION', 'A', 'CAPTION', 'HR']);
  [...root.querySelectorAll('*')].forEach((el) => {
    if (!el.isConnected) return;
    if (!ALLOW.has(el.tagName)) { el.remove(); return; }
    const href = el.getAttribute('href'), src = el.getAttribute('src'), alt = el.getAttribute('alt');
    [...el.attributes].forEach((at) => el.removeAttribute(at.name));
    if (el.tagName === 'IMG') {
      if (!src || !/upload\.wikimedia\.org/.test(src)) { el.remove(); return; }
      el.setAttribute('src', src.startsWith('//') ? 'https:' + src : src); el.setAttribute('alt', alt || ''); el.setAttribute('loading', 'lazy');
    }
    if (el.tagName === 'A') {
      if (href && /^https?:/.test(href)) { el.setAttribute('href', href); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
      else { const s = doc.createElement('span'); s.append(...el.childNodes); el.replaceWith(s); }
    }
  });
  root.querySelectorAll('table').forEach((t) => { const w = doc.createElement('div'); w.className = 'wb-tw'; t.replaceWith(w); w.append(t); });
  return root.innerHTML.trim();
}

function makeQuestion(html, key) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const text = doc.body.textContent.replace(/\s+/g, ' ');
  const sents = (text.match(/[^.!?]+[.!?]/g) || []).map((s) => s.trim()).filter((s) => s.length > 40 && s.length < 230);
  const Y = new Date().getFullYear(), h = hash(key);
  const pickS = (arr) => arr[h % arr.length];
  const shuffle = (arr) => arr.map((x, i) => [x, hash(key + i)]).sort((x, y) => x[1] - y[1]).map((x) => x[0]);
  const yr = sents.filter((s) => /\b(1[0-9]{3}|20[0-2][0-9])\b/.test(s));
  if (yr.length) {
    const s = pickS(yr), y = +/\b(1[0-9]{3}|20[0-2][0-9])\b/.exec(s)[1];
    const d = [...new Set([-50, -20, -10, 10, 20, 50].map((k) => y + k).filter((v) => v > 0 && v <= Y))];
    return { s: s.replace(String(y), '____'), ans: String(y), opts: shuffle([String(y), ...shuffle(d.map(String)).slice(0, 3)]) };
  }
  const nm = sents.filter((s) => /\b\d{1,3}\b/.test(s) && !/\d{4}/.test(s));
  if (nm.length) {
    const s = pickS(nm), n = +/\b(\d{1,3})\b/.exec(s)[1];
    const d = [...new Set([n + 1, n - 1, n * 2, n + 5, Math.round(n / 2)].filter((v) => v > 0 && v !== n))];
    if (d.length >= 3) return { s: s.replace(new RegExp(`\\b${n}\\b`), '____'), ans: String(n), opts: shuffle([String(n), ...d.slice(0, 3).map(String)]) };
  }
  const terms = [...new Set([...doc.querySelectorAll('b,strong')].map((b) => b.textContent.trim()).filter((t) => t.length > 2 && t.length < 30 && !/[:：]$/.test(t)))];
  const withTerm = sents.map((s) => [s, terms.find((t) => s.includes(t))]).filter((x) => x[1]);
  if (terms.length >= 4 && withTerm.length) {
    const [s, t] = pickS(withTerm);
    return { s: s.replace(t, '____'), ans: t, opts: shuffle([t, ...shuffle(terms.filter((x) => x !== t)).slice(0, 3)]) };
  }
  return null;
}

function classifyEn(a) {

  for (const k of ['deporte', 'cine', 'musica']) if (ENRE[k].test(a.desc)) return k;
  if (/\((?:born|[^()]{0,60}\d{3,4}\s*[–-]\s*[^()]{0,40}\d{3,4})/i.test(first) || /\b(politician|writer|painter|scientist|philosopher|poet|emperor|king|queen|president)\b/i.test(a.desc)) return 'personajes';
  for (const k of ['espacio', 'naturaleza', 'ciencia', 'tecnologia', 'deporte', 'cine', 'musica', 'arte', 'historia', 'lugares']) if (ENRE[k].test(all)) return k;
  return 'curiosidades';

async function reviewCromos(colId) {
  const cols = colId ? COLLECTIONS.filter((c) => c.id === colId) : COLLECTIONS;
  const qs = [];
  for (const c of cols) {
    const ready = c.q.filter(reviewReady); if (!ready.length) continue;
    const items = await resolveCol(c);
    ready.forEach((q) => {
      const me = items.find((x) => x.q === q); if (!me?.l) return;
      const others = shuffleR(items.filter((x) => x.q !== q && x.l), Math.random).slice(0, 3).map((x) => x.l);
      if (me.d && others.length >= 2) {
        const opts = shuffleR([me.l, ...others], Math.random);
        qs.push({ q: `Repaso de ${c.e} ${esc(c.n)}: ¿cuál es <b>${esc(me.d)}</b>?`, opts, correct: opts.indexOf(me.l), cq: q });
      } else qs.push({ q: `¿Recuerdas <b>${esc(me.l)}</b>? Toca para confirmar el repaso.`, opts: ['Sí, lo recuerdo'], correct: 0, cq: q });
    });
  }
  if (!qs.length) { toast('No hay cromos listos para repasar todavía'); return; }
  quizSheet('Repaso de cromos', shuffleR(qs, Math.random).slice(0, 10), (q, ok) => {
    const c = S.cromos[q.cq]; if (!c) return;
    if (ok) { c.lv = 2; addXP(10); } else c.fail = Date.now();
    persist();
  }, (score) => { syncColLevels(); toast(`Repaso terminado: ${score} correctas`); if (fbSub === 'extra') colId ? openCollection(colId) : openAlbum(); });
}
async function masteryExam(colId) {
  const c = COLLECTIONS.find((x) => x.id === colId); if (!c) return;
  const items = (await resolveCol(c)).filter((x) => x.l);
  const pool = shuffleR(items, Math.random).slice(0, 5), qs = [];
  pool.forEach((me, i) => {
    const others = shuffleR(items.filter((x) => x.q !== me.q), Math.random).slice(0, 3);
    const kind = me.img && i % 3 === 0 ? 'img' : me.d && i % 3 === 1 ? 'n2d' : me.d ? 'd2n' : 'img';
    if (kind === 'n2d' && others.every((o) => o.d)) { const opts = shuffleR([me.d, ...others.map((o) => o.d)], Math.random); qs.push({ q: `¿Qué es <b>${esc(me.l)}</b>?`, opts, correct: opts.indexOf(me.d) }); return; }
    const opts = shuffleR([me.l, ...others.map((o) => o.l)], Math.random);
    if (kind === 'img' && me.img) qs.push({ q: '¿Qué es lo que aparece en la imagen?', img: me.img, opts, correct: opts.indexOf(me.l) });
    else qs.push({ q: `¿Cuál es <b>${esc(me.d || c.n)}</b>?`, opts, correct: opts.indexOf(me.l) });

  quizSheet(`Maestría: ${c.n}`, qs, null, (score) => {

async function fetchSeriesArticle() {
  for (let t = 0; t < 2; t++) {
    const a = (await fetchQuality(1, 'es', true))[0]; if (!a) continue;
    const j = await getJSON(`${API}?action=query&format=json&formatversion=2&origin=*&prop=extracts&explaintext=1&exsectionformat=plain&pageids=${a.id}`);
    const full = (j.query?.pages?.[0]?.extract || '').replace(/\n{2,}/g, '\n').replace(/^(Véase también|Referencias|Enlaces externos|Bibliografía|Notas)[\s\S]*$/m, '');
    const paras = full.split('\n').map((x) => x.trim()).filter((x) => x.length > 80 && !/^(Véase|Referencias|Enlaces externos|Bibliografía|Notas)/.test(x));
    if (paras.join(' ').length < 2400) continue;
    const parts = [[], [], []], total = paras.reduce((s, p) => s + p.length, 0); let acc = 0;
    paras.forEach((p) => { const i = Math.min(2, Math.floor(acc / (total / 3))); if (parts[i].join(' ').length < 1500) parts[i].push(p); acc += p.length; });
    if (parts.some((p) => !p.length)) continue;
    A.set(a.id, a);
    S.series[a.id] = { id: a.id, title: a.title, img: a.img, parts: parts.map((p) => p.join('\n\n')), shown: 0, read: 0, at: Date.now() };
    const ids = Object.keys(S.series); if (ids.length > 6) ids.sort((x, y) => S.series[x].at - S.series[y].at).slice(0, ids.length - 6).forEach((k) => delete S.series[k]);

  }
  return null;
}

openPack = async function (n = 3, gold = false, colId = null) {
  const pool = COLLECTIONS.filter((c) => c.q.length && (!colId || c.id === colId)).flatMap((c) => c.q.map((q) => ({ q, c })));
  if (!pool.length) { addXP(40); toast('⭐ +40 XP'); return; }
  S.pity = (S.pity || 0) + 1;
  const force = S.pity >= 10, picks = [];
  for (let i = 0; i < n; i++) {
    const want = force && i === n - 1 ? 'Legendario' : gold && i === n - 1 ? (Math.random() < 0.3 ? 'Legendario' : 'Épico')
      : (() => { let r = Math.random() * 100; for (const [k, w] of RW) { if ((r -= w) <= 0) return k; } return 'Común'; })();
    let cand = pool.filter((x) => rarity(x.q)[1] === want); if (!cand.length) cand = pool;
    picks.push({ ...pickOne(cand), v: rollVar(gold) });
  }
  try { await Promise.all([...new Set(picks.map((x) => x.c))].map(resolveCol)); } catch {}
  const res = picks.map(({ q, c, v }) => {
    const own = S.cromos[q] || S.pend[q];
    let st;
    if (!own) { S.pend[q] = { at: Date.now(), v, src: 'sobre' }; st = 'new'; }
    else if (VRANK[v] > VRANK[own.v || '']) { own.v = v; st = 'up'; }
    else { S.dupes[q] = (S.dupes[q] || 0) + 1; st = 'dup'; }
    return { q, c, v, st, r: rarity(q), m: S.cromoMeta[q] || {} };
  });
  if (res.some((x) => x.r[1] === 'Legendario')) S.pity = 0;
  persist(); checkBadges();
  const left = 10 - (S.pity || 0);
  openSheet(gold ? 'Sobre dorado ✨' : colId ? `Sobre: ${COLLECTIONS.find((c) => c.id === colId)?.n}` : 'Sobre de cromos 🃏', `<div class="pack">${res.map((x, i) => `<div class="pk ${x.v}" style="--rc:${x.r[2]};animation-delay:${i * 0.35}s"><span class="pk-img ${x.v}"${x.m.img ? ` style="background-image:url('${esc(x.m.img)}')"` : ''}>${x.m.img ? '' : x.c.e}</span><b>${esc(x.m.l || x.q)}</b><small>${x.c.e} ${esc(x.c.n)}</small><em>${x.r[1]}${x.v ? ` · ${varLabel(x.v)}` : ''}</em><i class="${x.st === 'dup' ? 'dup' : 'new'}">${x.st === 'new' ? 'NUEVO' : x.st === 'up' ? '¡MEJORA!' : `Repetido ×${(S.dupes[x.q] || 0) + 1}`}</i></div>`).join('')}</div>
    <p class="sub" style="text-align:center;margin-top:12px">🎯 ${left <= 0 || S.pity === 0 ? 'Legendario garantizado reiniciado' : `Faltan <b>${left}</b> ${left === 1 ? 'sobre' : 'sobres'} para tu legendario garantizado`}</p>
    ${res.some((x) => x.st === 'new') ? '<p class="sub" style="text-align:center;margin-top:6px">⏳ Los cromos nuevos llegan <b>sin verificar</b>. Lee su artículo y responde la pregunta para activarlos. Los encuentras en el álbum.</p>' : ''}`);
  res.forEach((x, i) => setTimeout(() => sfx(x.r[1] === 'Legendario' || x.v ? 'win' : x.st === 'new' ? 'card' : 'pop'), 350 * i + 200));
  if (res.some((x) => x.r[1] === 'Legendario' || x.v === 'gold')) setTimeout(() => confetti(innerWidth / 2, innerHeight * 0.4), 1200);
};

/* ---------- Preguntas automáticas de mejor calidad ---------- */
const PRON = /^(es|fue|son|era|eran|su|sus|este|esta|estos|estas|también|además|sin embargo|por otro lado|it|he|she|they|this|its|his|her|their)\b/i;

  const lang = a.lang || 'es';
  if (a.src === 'quote' && a.q) return { kind: 'quote', q: `¿Quién dijo: «${short(a.q, 150)}»?`, ans: a.title, opts: null, lang };
  const text = (a.text || '').replace(/\s*\([^()]*\)/g, '').replace(/\s*\[[^\]]*\]/g, '');
  const sents = (text.replace(/\n+/g, ' ').match(/[^.!?]+[.!?]/g) || []).map((s) => s.trim()).filter((s) => s.length > 45 && s.length < 200);
  const tw = normTxt(a.title).split(' ').filter((w) => w.length > 3);
  const score = (s) => { const n = normTxt(s); let v = 0; if (tw.some((w) => n.includes(w))) v += 3; if (!PRON.test(s)) v += 1; if (/[;:]/.test(s)) v -= 1; return v; };
  const Y = new Date().getFullYear(), h = hash(a.id);
  const years = (s) => s.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/g) || [];
  const yr = sents.filter((s) => years(s).length === 1 && !/\d{3,4}\s*[-–]\s*\d{2,4}/.test(s) && !/\bsiglo|century\b/i.test(s)).sort((x, y) => score(y) - score(x));
  if (yr.length && score(yr[0]) >= 1) {
    const s = yr[0], y = +years(s)[0];
    const d = [...new Set(shuffleR([-40, -25, -12, -6, 6, 12, 25, 40], mulberry(h)).map((o) => y + o).filter((v) => v > 0 && v <= Y))].slice(0, 3);
    return { kind: 'cloze', q: s.replace(new RegExp(`\\b${y}\\b`, 'g'), '____'), ans: String(y), opts: shuffleR([String(y), ...d.map(String)], mulberry(h + 1)), lang };
  }
  const nm = sents.filter((s) => { const ns = s.match(/\b\d{1,3}\b/g) || []; return ns.length === 1 && +ns[0] >= 2 && !/\d{4}/.test(s) && !/\d[.,]\d/.test(s) && !/%/.test(s); }).sort((x, y) => score(y) - score(x));
  if (nm.length && score(nm[0]) >= 1) {
    const s = nm[0], n = +s.match(/\b\d{1,3}\b/)[0];
    const d = [...new Set([n + 1, n - 1, n + 2, n * 2, Math.round(n * 1.5), n + 5, Math.max(2, Math.round(n / 2))])].filter((v) => v > 0 && v !== n);
    return { kind: 'cloze', q: s.replace(new RegExp(`\\b${n}\\b`), '____'), ans: String(n), opts: shuffleR([String(n), ...shuffleR(d, mulberry(h)).slice(0, 3).map(String)], mulberry(h + 2)), lang };
  }
  if (a.desc && a.desc.length > 5 && a.desc.length < 90 && !/desambiguaci|wikimedia/i.test(a.desc)) return { kind: 'desc', q: `¿Qué es «${a.title}»?`, ans: a.desc, opts: null, lang, topic: a.topic };
  return null;
};

async function searchWiki(q) {
  if (SEARCH.has(q)) return SEARCH.get(q);
  const enc = encodeURIComponent(q), lang = S.lang || 'mix';
  const [feat, es, en] = await Promise.all([
    query(`&generator=search&gsrnamespace=0&gsrlimit=6&gsrsearch=${encodeURIComponent(`${q} incategory:"Wikipedia:Artículos destacados"`)}`, false).catch(() => []),
    query(`&generator=search&gsrnamespace=0&gsrlimit=20&gsrsearch=${enc}`, false).catch(() => []),
    lang === 'es' ? Promise.resolve([]) : queryEn(`&generator=search&gsrnamespace=0&gsrlimit=${lang === 'en' ? 14 : 8}&gsrsearch=${enc}`, false).catch(() => [])
  ]);
  feat.forEach((a) => { a.featured = true; });
  const seenIds = new Set(), all = [];
  [...feat, ...es].forEach((a, i) => { if (!seenIds.has(a.id)) { seenIds.add(a.id); a._r = i; all.push(a); } });
  let esCount = all.length;
  const extra = (lang === 'en' || esCount < 6) ? en : en.slice(0, 3);
  extra.forEach((a, i) => { if (!seenIds.has(a.id)) { seenIds.add(a.id); a._r = 30 + i; all.push(a); } });
  const nq = normTxt(q);
  const score = (a) => (a.featured ? 100 : 0) + (normTxt(a.title).includes(nq) || nq.includes(normTxt(a.title)) ? 60 : 0) + (a.img ? 12 : 0) + Math.min(10, a.text.length / 150) - a._r * 2;
  const res = all.sort((x, y) => score(y) - score(x)).slice(0, 18);
  res.forEach((a) => { a.why = 'curio:' + q; A.set(a.id, a); });
  SEARCH.set(q, res);
  return res;
}

  else { const n = 30 + rnd(31); addXP(n); prize = `⭐ ${n} XP`; }
  persist(); sfx('win'); confetti(innerWidth / 2, innerHeight * 0.45);
  openSheet('🎁 Cofre de curiosidad', `<div class="chest"><p class="chest-e">🔍🎁</p><p class="big" style="font-size:1.6rem">¡Reto completado!</p>
    <p>Leíste 3 artículos sobre «${esc(q)}» porque tú quisiste aprender de eso. Esa es la mejor forma de aprender.</p><div class="chest-p">${prize}</div></div>`);
}

/* Contar lecturas del reto y de tus curiosidades */
const __cr4 = countRead;
countRead = function (el) {
  const id = el.dataset.id, was = counted.has(id);
  __cr4(el);
  if (was) return;
  const a = getA(id);
  if (a?.why?.startsWith('curio:')) { const c = S.curio.find((x) => x.q === a.why.slice(6)); if (c) c.n = (c.n || 0) + 1; }
  const sq = S.sq;
  if (sq && !sq.done && sq.ids.includes(id)) {
    sq.read++; persist(); updateQuestUI();
    if (sq.read === 1 && !sq.dm) { sq.dm = true; setTimeout(() => socialReaction(sq.q), 25000 + rnd(30000)); }
    if (sq.read >= 3) { sq.done = true; persist(); updateQuestUI(); setTimeout(() => openCuriosityChest(sq.q), 1200); }
  }
  persist();
};

/* Reacción social por mensaje */
function socialReaction(q) {
  const res = SEARCH.get(q) || [];
  const unread = res.filter((a) => !counted.has(a.id) && a.img);
  const rec = unread[0] || res.find((a) => !counted.has(a.id));
  const k = pickPersona(), p = P[k];
  const msgs = [{ f: 'p', t: `¡Oye! Vi que andas buscando sobre ${q} 👀 Es de mis temas favoritos.`,
    ...(rec ? { card: minA(rec) } : {}),
    opts: [
      { l: '¡Sí! Me dio curiosidad', r: `¡Qué padre! A mí me encanta porque siempre descubro algo nuevo 🤓`, next: { t: `¿Qué fue lo que más te llamó la atención de ${q}?`, opts: [
        { l: 'Su historia', r: 'La historia detrás de las cosas siempre es lo mejor 📜' },
        { l: 'Cómo funciona', r: '¡Igual yo! Me gusta entender cómo funcionan las cosas ⚙️' },
        { l: 'Solo curiosidad', r: 'La curiosidad es el mejor motor para aprender 🚀' }] } },
      ...(rec ? [{ l: 'Pásame algo para leer', r: `¡Claro! Lee «${rec.title}», está buenísimo 📖`, a: 'read' }] : []),
      ...(res.length >= 5 ? [{ l: '¿Me armas una ruta?', r: `¡Va! Te armé 5 artículos, de lo más general a lo más específico 📚`, a: 'route', q }] : [])
    ] }];
  pushDM(k, msgs);
  addNotif({ icon: '💬', who: k, html: `<b>${esc(p.n)}</b>: “Vi que andas buscando sobre ${esc(q)} 👀”`, go: { t: 'dm', k } });
  toast(`💬 ${p.n} te escribió sobre «${q}»`);
}
function openQuickRoute(q) {
  const res = SEARCH.get(q); if (!res?.length) return;
  const nq = normTxt(q);
  const list = [...res].sort((x, y) => ((normTxt(y.title).includes(nq) ? 1000 : 0) + y.text.length) - ((normTxt(x.title).includes(nq) ? 1000 : 0) + x.text.length)).slice(0, 5);
  S.sq = { q, ids: [...new Set([...(S.sq?.q === q ? S.sq.ids : []), ...list.map((a) => a.id)])], read: S.sq?.q === q ? S.sq.read : 0, done: S.sq?.q === q ? S.sq.done : false, at: Date.now(), dm: true };
  persist();
  openSheet(`📚 Ruta rápida: ${q}`, `<p class="sub">De lo general a lo específico. Leer 3 completa el reto de búsqueda.</p>
    ${list.map((a, i) => `<button class="rq" data-hk="rq-open" data-id="${esc(a.id)}"><span class="wbl-n">${counted.has(a.id) ? '✓' : i + 1}</span><span><b>${esc(a.title)}</b><small>${esc(a.desc || T(a).n)}${a.lang === 'en' ? ' · inglés' : ''}</small></span></button>`).join('')}
    <div class="sq-wrap">${questHTML()}</div>`);
}

/* Tus curiosidades en el feed, en el perfil y 7 días después */
const __fb4 = fetchBatch;
fetchBatch = async function () {
  const list = await __fb4();
  const recent = S.curio.filter((c) => Date.now() - c.at < 14 * 864e5);
  if (recent.length && Math.random() < 0.35) {
    const c = pickOne(recent);
    try {
      const more = (await query(`&generator=search&gsrnamespace=0&gsrlimit=10&gsroffset=${rnd(20)}&gsrsearch=${encodeURIComponent(c.q)}`)).filter((a) => !A.has(a.id)).slice(0, 2);
      more.forEach((a) => { a.why = 'curio:' + c.q; });
      list.splice(Math.min(3, list.length), 0, ...more);
    } catch {}
  }
  return list;
};
const __wl3 = whyLabel;
whyLabel = function (w) { if (w?.startsWith('curio:')) return `🔍 Porque buscaste «${esc(w.slice(6))}»`; return __wl3(w); };
const __rp6 = renderProfile;
renderProfile = function () {
  __rp6();
  if (!S.curio.length) return;
  const anchor = $('#profile .hl-row'); if (!anchor) return;
  anchor.insertAdjacentHTML('afterend', `<div class="lvbox curio"><b>🔍 Tus curiosidades</b><p class="sub" style="margin:4px 0 8px">Lo que has buscado. Estos temas aparecen más seguido en tu feed.</p>
    <div class="goals">${S.curio.slice(0, 12).map((c) => `<button class="chip" data-hk="search-q" data-q="${esc(c.q)}">${esc(c.q)}${c.n ? ` · ${c.n} 📖` : ''}</button>`).join('')}</div></div>`);
};
const __edn5 = ensureDailyNotifs;
ensureDailyNotifs = async function () {
  const fresh = S.notifMeta.day !== dayKey();
  await __edn5();
  if (!fresh) return;
  const c = S.curio.find((x) => !x.nt && Date.now() - x.at >= 7 * 864e5 && Date.now() - x.at < 10 * 864e5);
  if (c) { c.nt = 1; persist(); addNotif({ icon: '🔍', html: `Hace una semana buscaste <b>«${esc(c.q)}»</b>. ¡Hay más para descubrir!`, go: { t: 'search', q: c.q } }); }
};
const __on5 = openNotif;
openNotif = function (nid) { const n = S.notifs.find((x) => x.nid === nid); if (n?.go?.t === 'search') { n.read = true; persist(); runSearch(n.go.q); return; } __on5(nid); };

/* Botones y acciones */
$('.hud-r').insertAdjacentHTML('afterbegin', `<button class="hud-dm" data-hk="search-g" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></button>`);
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-hk]'); if (!b) return;
  const k = b.dataset.hk;
  const fn = {
    'search-g': openSearchSheet, 'search-b': openSearchSheet,
    'srch-go': () => { const q = $('#srch-in')?.value.trim(); if (q) runSearch(q); },
    'search-q': () => runSearch(b.dataset.q),
    'rq-open': () => { const a = getA(b.dataset.id); if (a) { closeSheet(); openRead(a); } }
  }[k];
  if (fn) { e.stopPropagation(); fn(); }
}, true);

/* =========================================================
   Inicio
   ========================================================= */
updateHud(); updateSavedDot(); renderStories(); skeleton();
setMode(S.mode, false);
setGramFeed(S.gramFeed);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
